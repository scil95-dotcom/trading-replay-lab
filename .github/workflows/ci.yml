name: Validate offline replay
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m trading_lab demo --output artifacts/ci-demo.json
      - run: python -c "import json; a=json.load(open('artifacts/demo.json')); b=json.load(open('artifacts/ci-demo.json')); assert a == b"
