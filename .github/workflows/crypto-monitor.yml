name: Crypto research monitor
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - research/cloud_monitor.py
      - research/crypto-monitor/**
      - .github/workflows/crypto-monitor.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: crypto-monitor-state
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.34.2
      - run: python research/cloud_monitor.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Preserve rolling history and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crypto-monitor-state
          path: reports/monitor/
          retention-days: 7
          if-no-files-found: error
